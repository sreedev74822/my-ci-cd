name: GitHub Actions Demo
on:
  push:
    branches: [feature/github-actions]
  pull_request:
jobs:
  Build:
    runs-on: ubuntu-latest

    steps:
       - name: Checkout code
         uses: actions/checkout@v4

       - name: Setup Node
         uses: actions/setup-node@v4
         with:
          node-version: "lts/*"
       - name: Build app
         run: pnpm run build